# api:

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

font:
  - file: "digital-7.ttf"
    id: digital7font
    size: 48

time:
  - platform: sntp
    id: sntp_time
    timezone: "UTC"

mcp23017:
  - id: 'mcp23017_hub'
    address: 0x20
    interrupt_pin: GPIO7

binary_sensor:
  - platform: gpio
    name: "MCP23017 Input Button B0"
    pin:
      mcp23xxx: mcp23017_hub
      number: 8        # Pin 8 on MCP23017 is B0
      inverted: true           
      mode:
        input: true     
        pullup: true     
    on_press:
    - logger.log: "Button 1 pressed"
  - platform: gpio
    name: "MCP23017 Input Button B1"
    pin:
      mcp23xxx: mcp23017_hub
      number: 9  # Pin 9 on MCP23017 is B1
      mode:
        input: true     
        pullup: true         
      inverted: true
    on_press:
      - logger.log: "Button 2 pressed"
  - platform: gpio
    name: "MCP23017 Input Button B2"
    pin:
      mcp23xxx: mcp23017_hub
      number: 10        # Pin 10 on MCP23017 is B2
      inverted: true           
      mode:
        input: true     
        pullup: true     
    on_press:
    - logger.log: "Button 3 pressed"
  - platform: gpio
    name: "MCP23017 Input Button B3"
    pin:
      mcp23xxx: mcp23017_hub
      number: 11  # Pin 11 on MCP23017 is B3
      mode:
        input: true     
        pullup: true         
      inverted: true
    on_press:
      - logger.log: "Button 4 pressed"

text_sensor:
  - platform: template
    id: melbourne_clock
    update_interval: 15s
    on_value: 
      then:
        - lvgl.label.update:
             id: maintime
             text:
               format: "%s"
               args: [ 'x.c_str()' ]    
    lambda: |-
      auto now = id(sntp_time).now();
      if (!now.is_valid()) return {"--:--"};

      return {
        format_timezone_time(
          now.timestamp,
          "AEST-10AEDT,M10.1.0/2,M4.1.0/3"
        )
      };

display:
  - platform: mipi_spi
    model: ILI9341
    id: mylcd
    dc_pin: GPIO2
    #reset_pin: 0
    cs_pin: GPIO15
    rotation: 0
    invert_colors: false
    update_interval: never
    #color_depth: 8
    #show_test_card: true
    color_order: bgr
    dimensions:
      width: ${tft_width}
      height: ${tft_height}
      offset_width: "0"
      offset_height: "30"
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false

lvgl:
  buffer_size: 25%
  bg_color: black
  text_color: white
  pages:
    - id: main_page
      widgets:
        - obj:
            width: 100%
            height: 100%
            align: CENTER
            bg_opa: TRANSP
            border_width: 1
            border_color: white
            radius: 0
        - label:
            id: maintime
            text: "--:--"
            align: CENTER
            text_font: digital7font

 