substitutions:
  tft_width: 284
  tft_height: 76
  # tft_width: 320
  # tft_height: 240

esphome:
  name: clockalarm
  includes:
    - clockalarm.h

esp32:
  board: esp32-s3-devkitm-1
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 120MHz

logger:
  hardware_uart: UART0
  logs:
    log: NONE
    component: NONE


wifi:
  ssid: "Wokwi-GUEST"

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  id: bus_a

