substitutions:
  tag: "mohan"
  gif_file: "admail.c"
  tft_width: 320
  tft_height: 240

esphome:
  name: gifesp32c3lvgl
  on_boot:
    priority: 600  # Very early, before WiFi
    then:
      - lambda: |-
          ESP_LOGI("EARLY", "Boot priority 600 - I2C not initialized yet");
  
  # # 1. Copy the GIF file into the build source directory
  # includes:
  #   - ${gif_file}

  # # 2. Add the specific library required by LVGL's GIF decoder
  # libraries:
  #   - "bitbank2/AnimatedGIF@^1.4.7"

  # platformio_options:
  #   # 3. Enable the GIF module in LVGL
  #   build_flags: 
  #     - "-DLV_USE_GIF=1"
  #   # 4. Embed the raw file into the binary flash
  #   #    (PlatformIO looks in 'src/' because 'includes' put it there)
  #   #board_build.embed_files: src/${gif_file}

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    #version: 5.5.1
    #platform_version: https://github.com/swoboda1337/platform-espressif32.git#uv_pip_debug

logger:
  level: DEBUG  # Set global to most verbose you need
  #baud_rate: 9600
  hardware_uart: UART0
  # logs:
  #   i2c: DEBUG
  #   ft63x6: DEBUG
  #   touchscreen: DEBUG
  #   lvgl: WARN      # Raise less important ones
  #   sensor: INFO
  #   component: ERROR
  #   wifi: INFO      # Keep network stuff quiet
  #   api: INFO

spi:
  clk_pin: GPIO3
  mosi_pin: GPIO4

display:
  - platform: mipi_spi
    model: ILI9341
    id: mylcd
    dc_pin: GPIO6
    cs_pin: GPIO5
    reset_pin: GPIO7
    rotation: 0
    invert_colors: false
    update_interval: 350ms
    color_order: bgr
    dimensions:
      width: ${tft_width}
      height: ${tft_height}
      offset_width: "0"
    # transform:
    #   swap_xy: true
    #   mirror_x: false
    #   mirror_y: false

i2c:
  sda: GPIO8 
  scl: GPIO9
  scan: true
  id: bus_a

touchscreen:
  - platform: ft63x6
    id: my_touchscreen
    display: mylcd
    calibration:
      x_min: 0
      x_max: 240
      y_min: 0
      y_max: 320
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true      
    on_touch:
      - lambda: |-
            ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
                touch.x,
                touch.y,
                touch.x_raw,
                touch.y_raw
                );    

lvgl:
  displays:
    - mylcd

  pages:
    - id: main_page
      widgets:
        - obj:
            align: TOP_MID
            layout:
              type: flex
              flex_flow: column
            width: 100%
            widgets:
              - button:
                  id: mybutton
                  on_press:
                    then:
                      - logger.log: "Button pressed"
                  widgets:
                    - label:
                        text: "Press me"
    - id: gif_page
      widgets:
        - obj:
            id: gif_container  # <--- 1. Give the container an ID
            width: 100%
            height: 100%
      