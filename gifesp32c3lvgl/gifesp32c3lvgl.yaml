substitutions:
  tag: "mohan"
  gif_file: "admail.c"
  tft_width: 320
  tft_height: 240

esphome:
  name: gifesp32c3lvgl
  includes:
    - ${gif_file}
  on_boot:
    priority: -100.0
    then:
      - lambda: |-
          uint32_t free_heap = esp_get_free_heap_size();
          uint32_t min_free = esp_get_minimum_free_heap_size();
          ESP_LOGI("memory", "--- System Heap ---");
          ESP_LOGI("memory", "Free Heap: %u bytes", free_heap);

  platformio_options:
    build_flags: 
      - "-DLV_USE_GIF=1"
      - "-DLV_USE_IMG=1"

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    #version: 5.5.1
    #platform_version: https://github.com/swoboda1337/platform-espressif32.git#uv_pip_debug

logger:
  hardware_uart: UART0
  logs:
    logger: NONE
    spi: NONE
    spi_device: NONE
    display.mipi_spi: NONE
    i2c: NONE
    i2c.idf: NONE
    FT63X6: NONE
    touchscreen: NONE
    lvgl: NONE     
    sensor: NONE
    component: NONE

spi:
  clk_pin: GPIO3
  mosi_pin: GPIO4

display:
  - platform: mipi_spi
    model: ILI9341
    id: mylcd
    dc_pin: GPIO6
    cs_pin: GPIO5
    reset_pin: GPIO7
    rotation: 0
    invert_colors: false
    update_interval: 350ms
    color_order: bgr
    dimensions:
      width: ${tft_width}
      height: ${tft_height}
      offset_width: "0"
    # transform:
    #   swap_xy: true
    #   mirror_x: false
    #   mirror_y: false

i2c:
  sda: GPIO8 
  scl: GPIO9
  scan: true
  id: bus_a

touchscreen:
  - platform: ft63x6
    id: my_touchscreen
    display: mylcd
    calibration:
      x_min: 0
      x_max: 240
      y_min: 0
      y_max: 320
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true      
    on_touch:
      - lambda: |-
            ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
                touch.x,
                touch.y,
                touch.x_raw,
                touch.y_raw
                );    

lvgl:
  displays:
    - mylcd

  pages:
    - id: main_page
      widgets:
        - obj:
            align: TOP_MID
            layout:
              type: flex
              flex_flow: column
            width: 100%
            widgets:
              - button:
                  id: mybutton
                  on_press:
                    then:
                      - logger.log: "Button pressed"
                      - lambda: |-
                          extern const lv_img_dsc_t Admail;
                          lv_obj_t *gif = lv_gif_create(id(gif_container));
                          lv_gif_set_src(gif, &Admail);
                          lv_obj_center(gif);

                          
                      - lvgl.page.show:
                          id: gif_page

                  widgets:
                    - label:
                        text: "Press me"
    - id: gif_page
      widgets:
        - obj:
            id: gif_container
            width: 100%
            height: 100%
      