substitutions:
  tag: "mohan"
  gif_file: "admail.gif"
  tft_width: 320
  tft_height: 240

esphome:
  name: gifesp32c3lvgllittlefs
  includes:
    - littlefs_import.h
  platformio_options:
    build_flags: 
      - "-DLV_USE_GIF=1"
      - "-DLV_USE_IMG=1"
      # Enable LVGL filesystem support and map it to our path
      # - "-DLV_USE_FS_STDIO=1"
      # - "-DLV_FS_STDIO_LETTER=A"       # Map drive letter 'A' 
      # - "-DLV_FS_STDIO_PATH=/littlefs" # Map 'A' to /littlefs  
  on_boot:
    priority: 600.0
    then:
      - lambda: |-
          esp_rom_printf("\x1b[20h"); //for wokwi to print nicely
          esp_rom_printf("mohan\r\n");
          uint32_t free_heap = esp_get_free_heap_size();
          uint32_t min_free = esp_get_minimum_free_heap_size();
          ESP_LOGI("memory", "---- System Heap ----");
          ESP_LOGI("memory", "Free Heap: %u bytes", free_heap);

          // --- LittleFS Mounting Logic ---
          // Initialize config struct
          esp_vfs_littlefs_conf_t conf = {};
          conf.base_path = "/littlefs";
          conf.partition_label = "spiffs";
          conf.format_if_mount_failed = false; // Formats if empty
          conf.dont_mount = false;

          // Register the filesystem
          esp_err_t ret = esp_vfs_littlefs_register(&conf);
          
          if (ret != ESP_OK) {
            ESP_LOGE("littlefs", "Failed to mount LittleFS (%s)", esp_err_to_name(ret));
          } else {
            ESP_LOGI("littlefs", "LittleFS mounted successfully at /littlefs");
            
            // --- LIST ALL FILES ---
            ESP_LOGI("fs", "---- Listing Files ----");
            list_files("/littlefs"); // Call the function from the header
            ESP_LOGI("fs", "---- End of List ----");

            // Optional: Print file system info
            size_t total = 0, used = 0;
            esp_littlefs_info(conf.partition_label, &total, &used);
            ESP_LOGI("littlefs", "Total: %u bytes, Used: %u bytes", total, used);


          }          

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf
    components: 
      # Add the version operator and version number here (e.g., >=1.0.0 or ^1.20.4)
      - "joltwallet/littlefs>1.0.0" 
    advanced: 
      disable_vfs_support_dir: false
      include_builtin_idf_components: ["spiffs"]
    sdkconfig_options:
      CONFIG_LITTLEFS_USE_MTIME: "y"
  partitions: partitions.csv

  

#debug:

logger:
  hardware_uart: USB_SERIAL_JTAG
  logs:
    logger: info

spi:
  id: tft_bus
  clk_pin: GPIO8    # D8
  mosi_pin: GPIO10  # D10
  miso_pin: GPIO9   # D9

display:
  - platform: mipi_spi
    id: my_display
    spi_id: tft_bus
    model: ILI9341
    dimensions:
      width: 320
      height: 240
    # Rotation 90 or 270 makes it horizontal (landscape)
    rotation: 270 
    cs_pin: GPIO3   # D1
    dc_pin: GPIO2   # D0
    # reset_pin: GPIOXX # Not connected in your diagram
    
    # lambda: |-
    #   // Draw a small blue rectangle to test
    #   it.filled_rectangle(10, 10, 20, 30, id(my_blue));

color:
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true
  id: bus_a

touchscreen:
  - platform: ft63x6
    id: my_touchscreen
    display: my_display
    calibration:
      x_min: 0
      x_max: 240
      y_min: 0
      y_max: 320
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true      
    on_touch:
      - lambda: |-
            ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
                touch.x,
                touch.y,
                touch.x_raw,
                touch.y_raw
                );    


lvgl:
  displays:
    - my_display

  pages:
    - id: main_page
      widgets:
        - obj:
            align: TOP_LEFT
            layout:
              type: flex
              flex_flow: column
            width: 100%
            widgets:
              - button:
                  id: mybutton
                  on_press:
                    then:
                      - logger.log: "Button pressed"
                      - lambda: |-
                          // Create the GIF object
                          lv_obj_t *gif = lv_gif_create(id(gif_container));
                          
                          // Load from File System
                          // "A:" corresponds to /littlefs defined in build_flags
                          lv_gif_set_src(gif, "A:/admail.gif");
                          
                          lv_obj_center(gif);

                      - lvgl.page.show:
                          id: gif_page

                  widgets:
                    - label:
                        text: "Press me"
    - id: gif_page
      widgets:
        - obj:
            id: gif_container
            width: 100%
            height: 100%

